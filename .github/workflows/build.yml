name: Build

on: [pull_request]

env:
  APP_NAME: "Pace Racer FW"
  IDF_TARGET: 'esp32s3'
  IDF_VERSION: 'v6.0'
  IDF_COMPONENT_MANAGER: "1" # whether to enable the component manager or not
  FLASH_TOTAL_OVERRIDE: '4000000' # number of bytes of total flash (for percentage calculations)

jobs:
  build-main:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Build main
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}

    - name: Determine Size Delta
      uses: esp-cpp/esp-idf-size-delta@v1
      with:
        app_name: ${{ env.APP_NAME }}
        app_path: "."
        idf_target: ${{ env.IDF_TARGET }}
        idf_version: ${{ env.IDF_VERSION }}
        idf_component_manager: ${{ env.IDF_COMPONENT_MANAGER }}
        flash_total_override: ${{ env.FLASH_TOTAL_OVERRIDE }}

  build-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example_path:
          - components/drv8353/example
          - components/lm75adp/example
          - components/pace-racer-board/example
          - components/pace-racer-board/bringup
          - components/pace-racer-board/halls-sensorless
          - components/pace-racer-board/ethernet

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Build example
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: ${{ matrix.example_path }}
        target: ${{ env.IDF_TARGET }}
