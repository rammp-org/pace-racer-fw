dependencies:
  idf:
    version: '>=5.0'
  # RTPS/DDS participant: MotorCommand in, MotorState out, over the typed
  # pub/sub layer (espp::Publisher/Subscriber).
  # Pinned exactly: '>=1.4.1' resolved to 1.4.3 on the day it was published, so a
  # fresh build silently changed the RTPS engine. Older than 1.4.1 spins forever in
  # SPDPAgent::processProxyData() once the remote-participant table is full, which
  # hung both wheels on the flatbot (rammp-org/pace-racer-fw#22).
  espp/rtps: '==1.4.3'
  # Every espp component on one release (fw 0.4.10, 2026-11-16).
  espp/adc: '==1.4.3'
  espp/base_component: '==1.4.3'
  espp/base_peripheral: '==1.4.3'
  espp/bldc_driver: '==1.4.3'
  espp/bldc_motor: '==1.4.3'
  espp/bldc_types: '==1.4.3'
  espp/cdr: '==1.4.3'
  espp/cli: '==1.4.3'
  espp/coredump: '==1.4.3'
  espp/dispatcher: '==1.4.3'
  espp/ethernet: '==1.4.3'
  espp/filters: '==1.4.3'
  espp/format: '==1.4.3'
  espp/i2c: '==1.4.3'
  espp/interrupt: '==1.4.3'
  espp/led: '==1.4.3'
  espp/logger: '==1.4.3'
  espp/magnetic_encoder: '==1.4.3'
  espp/math: '==1.4.3'
  espp/mt6701: '==1.4.3'
  espp/ota: '==1.4.3'
  espp/pid: '==1.4.3'
  espp/reflect_cpp: '==1.4.3'
  espp/socket: '==1.4.3'
  espp/spi: '==1.4.3'
  espp/stream_frame: '==1.4.3'
  espp/task: '==1.4.3'
  espp/telemetry: '==1.4.3'
  espp/thread_pool: '==1.4.3'
  espp/timer: '==1.4.3'
  espp/usb_device: '==1.4.3'
  espressif/esp-dsp: '==1.8.2'
  # espp/usb_device >= 1.3.10 needs esp_tinyusb 3.x (one TinyUSB copy); tinyusb comes with it.
  espressif/esp_tinyusb: '>=3.0.0'
  espressif/w5500: '==2.0.0'
  espressif/wiznet_common: '==1.0.0'
  # Native USB (WebUSB) link for the dyno demo: vendor + CDC device, framed
  # stream multiplexer, OTA over the stream, telemetry, flash core dump.
