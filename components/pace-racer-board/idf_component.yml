## IDF Component Manager Manifest File
license: "MIT"
description: "PACE Racer Board component for ESP-C++ (ESP-PP) framework."
url: "https://github.com/rammp-org/pace-racer-fw/tree/main/components/pace-racer-board"
repository: "git://github.com/rammp-org/pace-racer-fw.git"
maintainers:
  - William Emfinger <waemfinger@gmail.com>
  - Swapnil Pande
  - Alex Stephens
  - Liyun Guo
examples:
  - path: example
  - path: bringup
  - path: ethernet
tags:
  - cpp
  - Component
  - PACE
  - RAMMP
  - Ethernet
  - W5500
dependencies:
  idf:
    version: '>=5.0'
  espp/adc: '>=1.0'
  espp/base_component: '>=1.0'
  espp/bldc_driver: '>=1.0'
  espp/bldc_motor: '>=1.0'
  drv8353:
    path: ../drv8353
  espp/filters: '>=1.0'
  espp/i2c: '>=1.0'
  espp/interrupt: '>=1.0'
  espp/led: '>=1.0'
  lm75adp:
    path: ../lm75adp
  espp/math: '>=1.0'
  espp/mt6701: '>=1.0'
  espp/pid: '>=1.0'
  espp/spi: '>=1.0'
  espp/timer: '>=1.0'
  # WIZnet W5500 Ethernet breakout on the SPI expansion header (shares SPI2 with
  # the DRV8353). Version 2.x targets ESP-IDF v6.0+.
  espressif/w5500: '^2.0.0'
targets:
  - esp32s3
